<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Inicio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        form {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .radio-group {
            margin: 15px 0;
        }
        .radio-group label {
            display: block;
            margin: 5px 0;
        }
        .input-group {
            margin: 15px 0;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .input-group input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Formulario de Opciones</h1>
    
    <form action="controla" method="post">
        <div class="radio-group">
            <label>Seleccione una opción:</label>
            <label>
                <input type="radio" name="opcion" value="hola" checked> Servlet Hola
            </label>
            <label>
                <input type="radio" name="opcion" value="productos"> Productos
            </label>
            <label>
                <input type="radio" name="opcion" value="google"> Google
            </label>
        </div>
        
        <div class="input-group">
            <label for="nombre">Ingrese su nombre:</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
